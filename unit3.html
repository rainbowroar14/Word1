var QCUR=[];

function qesc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function qshuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function showQuiz(){
  QCUR=QBANK.map(function(x){return {q:x.q,c:x.c.slice(),a:x.a,x:x.x};});
  qshuffle(QCUR);
  for(var i=0;i<QCUR.length;i++) qshuffle(QCUR[i].c);
  var h="";
  for(var i=0;i<QCUR.length;i++){
    h+="<li><div>"+qesc(QCUR[i].q)+"</div>";
    for(var j=0;j<QCUR[i].c.length;j++){
      h+="<label><input type=\"radio\" name=\"qz"+i+"\" value=\""+j+"\"> "+qesc(QCUR[i].c[j])+"</label><br>";
    }
    h+="<div id=\"qx"+i+"\"></div><br></li>";
  }
  document.getElementById("quiz").innerHTML=h;
  document.getElementById("qscore").textContent="";
}
function checkQuiz(){
  var right=0;
  for(var i=0;i<QCUR.length;i++){
    var sel=document.querySelector("input[name=qz"+i+"]:checked");
    var box=document.getElementById("qx"+i);
    var ok=sel && QCUR[i].c[Number(sel.value)]===QCUR[i].a;
    if(ok) right++;
    box.className=ok?"right":"wrong";
    box.textContent=(ok?"Correct. ":"Incorrect. The correct answer is "+QCUR[i].a+". ")+QCUR[i].x;
  }
  document.getElementById("qscore").textContent=" Score: "+right+" / "+QCUR.length;
}
function resetQuiz(){
  showQuiz();
}
